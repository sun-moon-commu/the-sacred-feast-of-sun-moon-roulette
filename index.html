<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陽月聖宴 - 룰렛</title>

<style>
/* =========================================================
   ★ 디자인을 바꾸고 싶다면 여기부터 수정하면 됩니다.
   ========================================================= */
/* =====================================================
   ★ 직접 폰트를 넣고 싶을 때
   1. fonts 폴더를 만들고 폰트 파일을 넣습니다.
      예: fonts/myfont.woff2
   2. 아래 주석을 해제하고 파일명을 변경합니다.
   3. :root의 --main-font 값을 "MyFont"로 변경합니다.

@font-face {
    font-family: "MyFont";
    src: url("./fonts/myfont.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
}
   ===================================================== */

:root {
    /* =====================================================
       ★ 여기만 수정하면 디자인을 쉽게 바꿀 수 있습니다.
       ===================================================== */

    /* 기본 색상 */
    --page-bg: #2d3057;
    --card-bg: #4e5691;
    --main-text: #ffffff;
    --accent: #ffffff;

    /* 입력창 / 결과창 */
    --input-bg: rgba(255,255,255,.06);
    --input-border: rgba(255,255,255,.75);
    --button-bg: #ffffff;
    --button-text: #454783;
    --result-bg: rgba(255,255,255,.08);

    /* 모바일 기준 크기 */
    --mobile-width: 390px;
    --mobile-height: 844px;

    /* 카드 여백 */
    --side-padding: 24px;

    /*
       ★ 폰트 변경
       기본값을 사용하려면:
       --main-font: "Noto Serif KR", "Batang", serif;

       직접 폰트 파일을 넣으려면 아래처럼 사용할 수 있습니다.
       @font-face는 CSS 아래쪽에 예시가 있습니다.
    */
    --main-font: "Noto Serif KR", "Batang", "Nanum Myeongjo", serif;

    /*
       ★ 사이트 전체 배경 이미지
       images/background.png를 넣은 뒤 아래처럼 변경:
       --page-bg-image: url("./images/background.png");
    */
    --page-bg-image: none;

    /*
       ★ 카드 배경 이미지
       images/card-background.png를 넣은 뒤:
       --card-bg-image: url("./images/card-background.png");
    */
    --card-bg-image: none;

    /*
       ★ 모서리 장식 이미지
       각각 원하는 이미지 파일을 넣을 수 있습니다.
       사용하지 않으면 none.
    */
    --corner-tl: none;
    --corner-tr: none;
    --corner-bl: none;
    --corner-br: none;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: var(--page-bg);
    background-image: var(--page-bg-image);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--main-text);
    font-family: var(--main-font);
}

/* PC에서도 가운데 정렬, 모바일에서는 화면에 꽉 차도록 */
.page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 16px;
}

.card {
    position: relative;
    width: 100%;
    min-height: var(--mobile-height);
    box-sizing: border-box;
    padding: 34px var(--side-padding) 38px;
    overflow: hidden;
    border-radius: 0;
    background: var(--card-bg);
    background-image: var(--card-bg-image);
    background-size: cover;
    background-position: center;
    box-shadow: none;
}

@media (min-width: 561px) {
    .page {
        padding: 32px 16px;
    }

    .card {
        width: var(--mobile-width);
        height: var(--mobile-height);
        min-height: 0;
    }
}

/* =====================================================
   ★ 사이드 장식
   이미지 파일을 넣으면 CSS 변수로 각각 교체할 수 있습니다.
   ===================================================== */
.corner {
    position: absolute;
    width: 38px;
    height: 58px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    pointer-events: none;
}

.corner.tl { top: 12px; left: 9px; background-image: var(--corner-tl); }
.corner.tr { top: 12px; right: 9px; background-image: var(--corner-tr); }
.corner.bl { bottom: 12px; left: 9px; background-image: var(--corner-bl); }
.corner.br { bottom: 12px; right: 9px; background-image: var(--corner-br); }

.title {
    margin: 0;
    text-align: center;
    font-size: clamp(36px, 8vw, 57px);
    line-height: 1.05;
    letter-spacing: -4px;
    font-weight: 700;
    text-shadow: 1px 2px 0 rgba(0,0,0,.12);
}

.title-line {
    display: flex;
    align-items: center;
    gap: 13px;
    margin: 22px 14px 48px;
}

.title-line::before,
.title-line::after {
    content: "";
    height: 2px;
    flex: 1;
    background: var(--accent);
}

.diamond {
    width: 10px;
    height: 10px;
    flex: 0 0 auto;
    background: var(--accent);
    transform: rotate(45deg);
}

.multiplier-list {
    margin: 0 0 22px;
    text-align: center;
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
}

.roulette {
    width: min(230px, 60vw);
    aspect-ratio: 1;
    margin: 0 auto 22px;
    border: 7px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
}

.roulette-result {
    /* ★ 기존 빨간 점선 원 삭제 — 결과 숫자만 표시 */
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    text-align: center;
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 700;
    transition: transform .12s ease;
}

/* 숫자 전환: 빠른 도로록 / 흔들림 없음 */
.number-swish {
    animation: numberRoll .16s ease-out;
}

@keyframes numberRoll {
    0% {
        opacity: .35;
        transform: translateY(-7px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

.spin-button {
    display: block;
    margin: 0 auto 28px;
    min-width: 138px;
    padding: 12px 22px;
    border: 0;
    border-radius: 0;
    background: var(--button-bg);
    color: var(--button-text);
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
}

.spin-button:active {
    transform: translateY(1px);
}

.spin-button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 0 14px 20px;
}

.input-group {
    min-width: 0;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    text-align: center;
    font-size: 15px;
}

.input-group input {
    width: 100%;
    min-height: 52px;
    padding: 8px 10px;
    border: 1px solid var(--input-border);
    border-radius: 0;
    outline: none;
    background: var(--input-bg);
    color: var(--main-text);
    font: inherit;
    font-size: 18px;
    text-align: center;
}

.input-group input:focus {
    box-shadow: 0 0 0 2px rgba(255,255,255,.25);
}

.input-group input::placeholder {
    color: rgba(255,255,255,.55);
}

.result-box {
    margin: 0 auto;
    max-width: 205px;
    padding: 12px 14px;
    border: 1px solid var(--accent);
    background: var(--result-bg);
    text-align: center;
}

.result-label {
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
}

.final-amount {
    font-size: 24px;
    font-weight: 700;
    word-break: break-all;
}

.community-message {
    margin: 20px auto 0;
    max-width: 300px;
    padding: 12px 14px;
    text-align: center;
    font-size: 14px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: anywhere;
    opacity: .95;
}
.community-message::before {
    content: "────── ✦ ──────";
    display: block;
    margin-bottom: 8px;
    font-size: 10px;
    letter-spacing: 1px;
    opacity: .75;
}
.community-message::after {
    content: "────── ✦ ──────";
    display: block;
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 1px;
    opacity: .75;
}

.message {
    min-height: 22px;
    margin-top: 13px;
    text-align: center;
    font-size: 13px;
    opacity: .9;
}

/* 모바일 */
@media (max-width: 560px) {
    .page {
        padding: 0;
        align-items: flex-start;
        min-height: 100svh;
    }

    .card {
        width: 100%;
        max-width: var(--mobile-width);
        min-height: max(var(--mobile-height), 100svh);
        padding: 32px var(--side-padding) 30px;
        box-shadow: none;
    }
}
    .title {
        font-size: clamp(34px, 11vw, 48px);
    }

    .title-line {
        margin-bottom: 40px;
    }

    .multiplier-list {
        font-size: 14px;
    }

    .inputs {
        gap: 10px;
        margin-left: 0;
        margin-right: 0;
    }

    .input-group label {
        font-size: 14px;
    }

    .input-group input {
        font-size: 16px;
    }
}

/* PC에서도 모바일 비율의 카드가 가운데 놓입니다. */
@media (min-width: 561px) {
    .page {
        padding: 32px 16px;
    }

    .card {
        width: var(--mobile-width);
        height: var(--mobile-height);
        min-height: 0;
    }
}
</style>
</head>

<body>
<main class="page">
    <section class="card">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <!-- 제목 -->
        <h1 class="title">陽月聖宴</h1>

        <div class="title-line">
            <span class="diamond"></span>
        </div>

        <!-- 배수 목록 -->
        <p class="multiplier-list">
            배수 : 0, -1, -3, -5, -10, +1, +3, +5, +10
        </p>

        <!-- 룰렛 결과 -->
        <div class="roulette" aria-live="polite">
            <div class="roulette-result" id="rouletteResult">+10</div>
        </div>

        <button class="spin-button" id="spinButton">룰렛 돌리기</button>

        <!-- 금액 입력 -->
        <div class="inputs">
            <div class="input-group">
                <label for="baseAmount">기존금액</label>
                <input id="baseAmount" type="number" inputmode="numeric" placeholder="0" min="0">
            </div>

            <div class="input-group">
                <label for="betAmount">베팅금액</label>
                <input id="betAmount" type="number" inputmode="numeric" placeholder="0" min="0">
            </div>
        </div>

        <!-- 최종 금액 -->
        <div class="result-box">
            <span class="result-label">최종금액</span>
            <strong class="final-amount" id="finalAmount">0</strong>
        </div>

        <div class="community-message" id="communityMessage"></div>

        <div class="message" id="message"></div>
    </section>
</main>

<script>
/* =========================================================
   ★ 기능 설정
   여기의 숫자만 바꾸면 룰렛 배수를 자유롭게 수정할 수 있습니다.
   ========================================================= */
const MULTIPLIERS = [0, -1, -3, -5, -10, 1, 3, 5, 10];

/* ★ 커뮤 대사 — 이 문장만 바꾸면 됩니다.
   이모티콘 / 특수문자 / 일본어 / 한자도 입력할 수 있습니다.
*/
const COMMUNITY_MESSAGE = "운명을 만들어 가는 건 자신입니다.";

/*
    계산식:
    최종금액 = 기존금액 + (베팅금액 × 당첨배수)

    예:
    기존금액 10,000
    베팅금액 2,000
    배수 +3
    → 10,000 + (2,000 × 3) = 16,000
*/

const rouletteResult = document.getElementById("rouletteResult");
const spinButton = document.getElementById("spinButton");
const baseAmount = document.getElementById("baseAmount");
const betAmount = document.getElementById("betAmount");
const finalAmount = document.getElementById("finalAmount");
const message = document.getElementById("message");
const communityMessage = document.getElementById("communityMessage");

let currentMultiplier = 10;
let spinning = false;

function formatNumber(value) {
    return Number(value).toLocaleString("ko-KR");
}

function calculateFinal() {
    const base = Number(baseAmount.value) || 0;
    const bet = Number(betAmount.value) || 0;
    const result = base + (bet * currentMultiplier);

    finalAmount.textContent = formatNumber(result);
}

function displayMultiplier(value) {
    return value > 0 ? `+${value}` : `${value}`;
}

function animateNumberChange() {
    rouletteResult.classList.remove("number-swish");
    void rouletteResult.offsetWidth;
    rouletteResult.classList.add("number-swish");
}

function randomMultiplier() {
    return MULTIPLIERS[Math.floor(Math.random() * MULTIPLIERS.length)];
}

function spinRoulette() {
    if (spinning) return;

    spinning = true;
    spinButton.disabled = true;
    rouletteResult.classList.add("spinning");
    message.textContent = "";

    /*
      실제 결과를 먼저 정하고,
      약 1.2초 동안 숫자를 빠르게 바꾼 뒤 결과를 보여줍니다.
    */
    const finalMultiplier = randomMultiplier();
    const start = Date.now();
    const duration = 1200;

    const timer = setInterval(() => {
        const elapsed = Date.now() - start;

        if (elapsed >= duration) {
            clearInterval(timer);

            currentMultiplier = finalMultiplier;
            rouletteResult.textContent = displayMultiplier(finalMultiplier);
            animateNumberChange();
            rouletteResult.classList.remove("spinning");

            spinning = false;
            spinButton.disabled = false;
            calculateFinal();

            message.textContent =
                `당첨 배수 ${displayMultiplier(finalMultiplier)}가 적용되었습니다.`;
            return;
        }

        rouletteResult.textContent =
            displayMultiplier(randomMultiplier());
        animateNumberChange();
    }, 120);
}

spinButton.addEventListener("click", spinRoulette);
baseAmount.addEventListener("input", calculateFinal);
betAmount.addEventListener("input", calculateFinal);

/* 시작 화면 */
communityMessage.textContent = COMMUNITY_MESSAGE;
calculateFinal();
</script>
</body>
</html>
